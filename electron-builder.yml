appId: com.praisepresenter.app
productName: PraisePresenter

# Publishing is handled by the release.yml workflow — prevent electron-builder
# from attempting to upload artifacts itself when it detects a CI environment.
publish: never

directories:
  output: release

files:
  - dist/**
  - package.json

extraResources:
  - from: lyrics
    to: lyrics
    filter: "**/*.txt"

win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
